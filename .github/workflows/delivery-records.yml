name: Delivery records

# When a pull request is merged, send its work records to DriftShield.
# Default: only merged pull requests from a delivery branch of this same repository
# (auto/<owner>-<repo>/issue-N-rK). With the repository variable DS_RECORDS_ALL_PULLS=true, every merged
# pull request from a branch of this repository counts, so a reviewer's verdict on any pull request is recorded.
# Forks never reach it, and no privileged trigger is used. A repository that is not set up yet
# (no secret, variable or profile list) skips with a line in the step summary and stays green.
# Run by hand (Actions, Run workflow, a pull request number) to send or resend one merged pull request.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pull:
        description: Number of a merged pull request in this repository
        required: true

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  records:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && (vars.DS_RECORDS_ALL_PULLS == 'true' || startsWith(github.event.pull_request.head.ref, 'auto/') || startsWith(github.event.pull_request.head.ref, 'fm/')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .claude
      - name: Send records
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRIFTSHIELD_API_KEY: ${{ secrets.DRIFTSHIELD_API_KEY }}
          DS_REVIEWER_LOGINS: ${{ vars.DS_REVIEWER_LOGINS }}
          DS_RECORDS_ALL_PULLS: ${{ vars.DS_RECORDS_ALL_PULLS }}
          PULL_NUMBER: ${{ github.event.pull_request.number || inputs.pull }}
        run: python3 .claude/hooks/records.py --pull "$PULL_NUMBER"
